<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="description" content="外部通信・ライブラリ・設定保存なしでNXOpen用Pythonジャーナルをローカル生成する単一HTMLツールです。">
<title>NXジャーナル専用オフライン生成ツール</title>
<style>
:root{--accent:#087f8c;--ok:#287a45;--warn:#b4531a;--line:#d5dcdf;--bg-soft:#f3f8f8}
body{font-family:"Hiragino Sans","Meiryo",Arial,sans-serif;max-width:820px;margin:24px auto;padding:16px;color:#1d2b2e;line-height:1.6}
h1,h2{color:var(--accent)}
h2{border-bottom:2px solid var(--accent);padding-bottom:4px}
label{font-size:14px;display:block;margin-top:8px}
input,select{width:100%;padding:8px;margin:5px 0;box-sizing:border-box;font-size:16px}
button{padding:9px 16px;margin-top:10px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.pair{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px}
.chk input{width:auto;margin:0}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.note{font-size:13px;color:#58686c;margin-top:12px}
.warnbox{background:#fff6e5;border-left:4px solid var(--warn);padding:8px 12px;margin:12px 0;font-size:14px}
.result{margin-top:16px;border:1px solid var(--line);padding:10px}
.result span{color:var(--ok);font-weight:bold}
.fitlink{border:1px solid var(--accent);background:var(--bg-soft);border-radius:6px;padding:10px 14px;margin:14px 0}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.presets button{margin:0;padding:5px 12px}
#jCode{width:100%;height:300px;box-sizing:border-box;font-family:Consolas,"Courier New",monospace;font-size:12px;padding:8px}
.scroll{overflow-x:auto}
.del{margin:0;padding:4px 10px}
.badge{display:inline-block;padding:4px 14px;border-radius:4px;color:#fff;font-weight:bold;margin:8px 0}
.b-clear{background:var(--ok)}.b-trans{background:#8a6d00}.b-inter{background:var(--warn)}
.msg{color:var(--warn);margin-top:10px}
@media(max-width:560px){body{margin:8px auto;padding:12px}.grid3{grid-template-columns:1fr 1fr}}
/* 白を基調に、グラス調の奥行きを残したローカルUI */
:root{color-scheme:light;--accent:#2869a8;--ok:#24754f;--warn:#99601b;--line:rgba(42,72,112,.14);--bg-soft:#f1f6fc;--text:#1b2b40;--muted:#61738a}
body{max-width:960px;margin:0 auto;padding:48px 28px 56px;color:var(--text);background:radial-gradient(ellipse at 12% 0%,rgba(92,174,218,.14),transparent 38%),radial-gradient(ellipse at 88% 18%,rgba(139,128,208,.11),transparent 34%),linear-gradient(160deg,#f8fbff 0%,#eef4fb 52%,#f9fbff 100%);background-attachment:fixed}
main{padding:clamp(18px,3vw,34px);border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,rgba(255,255,255,.96),rgba(249,252,255,.92));box-shadow:0 24px 70px rgba(41,67,103,.1),inset 0 1px rgba(255,255,255,.95);backdrop-filter:blur(18px) saturate(125%);-webkit-backdrop-filter:blur(18px) saturate(125%)}
h1,h2{color:#203750;letter-spacing:-.025em}
h1{font-size:clamp(1.8rem,4vw,2.7rem);line-height:1.2}
h2{border-bottom:1px solid var(--line);padding-bottom:12px}
p{color:#43566e}
label{color:#344a63;font-weight:600}
input,select,textarea{color:#1b2b40;background:rgba(255,255,255,.94);border:1px solid rgba(63,91,127,.2);border-radius:12px;min-height:44px}
input::placeholder,textarea::placeholder{color:#8290a1}
button{color:#344a63;background:rgba(255,255,255,.8);border:1px solid rgba(63,91,127,.18);border-radius:12px;font-weight:600;transition:background .16s ease,border-color .16s ease,transform .16s ease}
button:hover{background:rgba(229,241,252,.9);border-color:rgba(40,105,168,.35);transform:translateY(-1px)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #4b91c5;outline-offset:3px}
.note{color:var(--muted)}
.warnbox{color:#754a13;background:#fff7e9;border-left-color:#d9942e;border-radius:4px 12px 12px 4px}
.result,.fitlink{color:var(--text);background:rgba(246,250,255,.84);border-color:var(--line);border-radius:16px}
.result span{color:var(--ok)}
.presets button{color:#2a5c83;background:rgba(224,241,252,.7);border-color:rgba(72,134,178,.2)}
.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:700px){body{padding:24px 14px 36px}main{border-radius:18px}.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:420px){body{padding:16px 10px 24px}.grid3{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main>
<h1>NXジャーナル作成</h1>
<p>板と穴の条件から、NXで再生できるPythonジャーナルを作成します。このページはNX本体やCADデータに接続せず、入力値を送信・保存しません。</p>
{{NX_TOOL_MARKUP}}
<p class="note">外部通信なしの単一HTMLです。NXでの実行は社内ルールに従い、確認済みのコードをmm単位の空パートで行ってください。</p>
</main>
<script>
const sg = v => (v > 0 ? "+" : "") + v;
{{NX_GENERATOR_SCRIPT}}
</script>
</body>
</html>
