<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>公差計算ツール</title>

<style>
body{
    font-family: Arial;
    max-width: 600px;
    margin: 50px auto;
    padding:20px;
}

input{
    width:100%;
    padding:8px;
    margin:5px 0;
}

button{
    padding:10px 20px;
    margin-top:10px;
    cursor:pointer;
}

.result{
    margin-top:20px;
    border:1px solid #ccc;
    padding:10px;
}
</style>
</head>

<body>

<h1>公差計算ツール</h1>

<label>基準寸法(mm)</label>
<input id="base" type="number" step="0.001">

<label>上限公差(mm)</label>
<input id="upper" type="number" step="0.001">

<label>下限公差(mm)</label>
<input id="lower" type="number" step="0.001">

<button onclick="calc()">計算</button>

<div class="result">
<p>最大寸法：<span id="max"></span></p>
<p>最小寸法：<span id="min"></span></p>
<p>公差幅：<span id="width"></span></p>
</div>

<script>
function calc(){

    let base = Number(document.getElementById("base").value);
    let upper = Number(document.getElementById("upper").value);
    let lower = Number(document.getElementById("lower").value);

    let max = base + upper;
    let min = base + lower;
    let width = max - min;

    document.getElementById("max").textContent = max.toFixed(3);
    document.getElementById("min").textContent = min.toFixed(3);
    document.getElementById("width").textContent = width.toFixed(3);
}
</script>

</body>
</html>
